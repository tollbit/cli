version: 2

project_name: tollbit

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: tollbit
    main: ./cmd/tollbit
    binary: tollbit
    # No `-tags dev`: release binaries MUST be the locked-down build (pinned
    # endpoints, no development-config merge). Never add the dev tag here.
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: tollbit-archives
    ids:
      - tollbit
    name_template: "tollbit_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Explicit list replaces GoReleaser's default glob, so LICENSE and README
    # must be listed here too or they'd drop out of the archive.
    files:
      - LICENSE
      - THIRD-PARTY-NOTICES.md
      - README.md

# The install prompts are also on the assets CDN. This copy and its checksums
# are independent of AWS, so a CDN copy can be audited against them.
checksum:
  name_template: "tollbit_{{ .Version }}_checksums.txt"
  extra_files:
    - glob: ./prompts/install-prompt.md
    - glob: ./prompts/install-troubleshooting.md

# Assets already on a release are never replaced: with replace_existing_artifacts
# off, uploading one fails, so a re-run that reaches the upload fails too. `mode`
# only keeps the release notes. To fix a bad release, cut a new version — do not
# mutate a published one. Mirrors the tag-immutable-releases ruleset.
release:
  mode: keep-existing
  extra_files:
    - glob: ./prompts/install-prompt.md
    - glob: ./prompts/install-troubleshooting.md
